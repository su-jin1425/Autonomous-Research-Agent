apiVersion: 1

deleteDatasources:
  - name: Prometheus

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090

    isDefault: true

    editable: true

    jsonData:
      httpMethod: POST

      queryTimeout: 60s

      timeInterval: 15s

      manageAlerts: true

      prometheusType: Prometheus

      cacheLevel: High

      incrementalQuerying: true

      incrementalQueryOverlapWindow: 10m

    version: 1