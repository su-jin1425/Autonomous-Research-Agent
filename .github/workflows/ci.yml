name: ci

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate imports
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -c "import app.main"

      - name: Initialize Database
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -c "import asyncio; from app.db.session import init_db; asyncio.run(init_db())"

      - name: Ruff Lint
        run: |
          ruff check .

      - name: Run Tests
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -v

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t autonomous-research-agent \
            .

      - name: Build Worker Image
        run: |
          docker build \
            -f docker/worker.Dockerfile \
            -t autonomous-research-worker \
            .

  migration-validation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: research_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d research_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          for i in {1..30}; do
            pg_isready \
              -h localhost \
              -p 5432 \
              -U postgres \
              -d research_db && break

            sleep 2
          done

      - name: Run Alembic Migrations
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/research_db
        run: |
          alembic upgrade head